<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:120,&quot;height&quot;:90},&quot;which&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;bench&quot;,&quot;dbinc&quot;,&quot;dipy&quot;,&quot;ohp&quot;,&quot;zhyby&quot;,&quot;pritahy&quot;,&quot;drep&quot;,&quot;legpress&quot;,&quot;bulhar&quot;,&quot;vypady&quot;,&quot;mrtvy&quot;,&quot;rdl&quot;,&quot;hip&quot;,&quot;lytka&quot;,&quot;clean&quot;,&quot;vyskok&quot;],&quot;default&quot;:&quot;bench&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
const IDS = ['bench','dbinc','dipy','ohp','zhyby','pritahy','drep','legpress','bulhar','vypady','mrtvy','rdl','hip','lytka','clean','vyskok'];

class Component extends DCLogic {
  renderVals() {
    const w = this.props.which || 'bench';
    const is = (k) => w === k;
    return {
      isBench: is('bench'), isDbinc: is('dbinc'), isDipy: is('dipy'), isOhp: is('ohp'),
      isZhyby: is('zhyby'), isPritahy: is('pritahy'), isDrep: is('drep'), isLegpress: is('legpress'),
      isBulhar: is('bulhar'), isVypady: is('vypady'), isMrtvy: is('mrtvy'), isRdl: is('rdl'),
      isHip: is('hip'), isLytka: is('lytka'), isClean: is('clean'), isVyskok: is('vyskok'),
      isGeneric: IDS.indexOf(w) < 0,
    };
  }
}
</script>
